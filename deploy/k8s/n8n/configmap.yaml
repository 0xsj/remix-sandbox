apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n-stack
data:
  # n8n settings
  N8N_HOST: "localhost"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"

  # Database connection
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Optional: Queue mode (uncomment to enable)
  # EXECUTIONS_MODE: "queue"
  # QUEUE_BULL_REDIS_HOST: "redis"
  # QUEUE_BULL_REDIS_PORT: "6379"
