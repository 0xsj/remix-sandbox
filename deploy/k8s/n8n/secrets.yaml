apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n-stack
type: Opaque
stringData:
  # Postgres
  POSTGRES_USER: n8n
  POSTGRES_PASSWORD: n8ndevpass
  POSTGRES_DB: n8n

  # n8n
  N8N_ENCRYPTION_KEY: "your-32-char-encryption-key-here"
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: n8ndevpass
